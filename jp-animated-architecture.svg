<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785" viewBox="0 0 1200 785" role="img" aria-labelledby="title desc"><title id="title">Full stack architecture in motion</title><desc id="desc">Animated conceptual reference architecture from React client, Node Express API, domain services and PostgreSQL to authentication, background workers, external APIs, logs and deployment.</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060B13"/><stop offset="48%" stop-color="#0C1424"/><stop offset="100%" stop-color="#0D1930"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14243C"/><stop offset="100%" stop-color="#0D182A"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7CE0F3"/><stop offset="60%" stop-color="#85B6F6"/><stop offset="100%" stop-color="#B7A5FF"/></linearGradient>
  <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3971E9" stop-opacity=".20"/><stop offset="100%" stop-color="#3971E9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#8FABC9" stroke-opacity=".064" stroke-width="1" fill="none"/></pattern>
  <style>
.font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,Monaco,monospace}
.reveal{opacity:0;animation:reveal .9s ease-out forwards}
.delay1{animation-delay:.15s}.delay2{animation-delay:.33s}.delay3{animation-delay:.52s}.delay4{animation-delay:.75s}
.light{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}
.dashes{stroke-dasharray:5 9;animation:dashes 8s linear infinite}
.shimmer{animation:shimmer 5s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.5s ease-out infinite}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
@keyframes scan{0%{transform:translateY(0);opacity:0}14%{opacity:.5}70%{opacity:.5}95%,100%{transform:translateY(330px);opacity:0}}
@keyframes dashes{to{stroke-dashoffset:-112}}
@keyframes shimmer{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes ring{0%{opacity:.8;transform:scale(.55)}85%,100%{opacity:0;transform:scale(2.5)}}
@media(prefers-reduced-motion:reduce){.reveal,.light,.scan,.dashes,.shimmer,.ring{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</defs>
<rect width="1200" height="785" rx="20" fill="url(#bg)"/><rect width="1200" height="785" rx="20" fill="url(#grid)"/><ellipse cx="936" cy="377" rx="432" ry="510" fill="url(#aura)"/><rect x="1" y="1" width="1198" height="783" rx="19" fill="none" stroke="#91A9CB" stroke-opacity=".23"/>
<g class="reveal delay1">
<text x="54" y="64" class="mono" font-size="13" font-weight="700" letter-spacing="2.3" fill="#8CD9F8">SYSTEM DESIGN / FROM REQUEST TO DELIVERY</text>
<text x="54" y="121" class="font" font-size="48" font-weight="850" letter-spacing="-2.2" fill="#F0F6FF">THE FULL PICTURE.</text>
<text x="55" y="148" class="font" font-size="17" fill="#9FB6D4">One request. Multiple layers. A complete application lifecycle.</text>
<g><rect x="974" y="63" width="174" height="30" rx="8" fill="#1A2B45" stroke="#A7C4E8" stroke-opacity=".35"/><text x="1061" y="83" class="mono" font-size="11.3" font-weight="650" text-anchor="middle" fill="#A7C4E8">CONCEPTUAL BLUEPRINT</text></g>
